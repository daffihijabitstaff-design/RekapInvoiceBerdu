<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rekap Invoice Berdu</title>
  <meta name="description" content="Filter, kelompokkan, dan cetak invoice per produk dari ekspor order berdu.id">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="font-sans text-sm leading-snug">

  <!-- Top bar -->
  <header class="sticky top-0 z-10 border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-[1240px] items-center justify-between gap-4 px-6 py-3.5">
      <div class="flex items-center gap-3">
        <div class="grid h-9 w-9 place-items-center rounded-[9px] bg-accent-600 text-[15px] font-bold text-white">R</div>
        <div>
          <div class="text-[15px] font-semibold">Rekap Invoice Berdu</div>
          <div class="text-xs text-gray-500">Ekspor order, rekap gudang, dan invoice per produk</div>
        </div>
      </div>
      <span id="fmt" class="whitespace-nowrap rounded-full border border-gray-200 bg-gray-100 px-3 py-1 text-xs text-gray-700">Belum ada data</span>
    </div>
  </header>

  <main class="mx-auto max-w-[1240px] px-6 py-6">

    <!-- Ringkasan -->
    <section class="mb-5 grid grid-cols-2 gap-3 md:grid-cols-4">
      <div class="rounded-xl border border-gray-200 bg-white p-4">
        <div id="st-orders" class="text-[22px] font-semibold tabular-nums tracking-tight">0</div>
        <div class="mt-0.5 text-xs text-gray-500">Order</div>
      </div>
      <div class="rounded-xl border border-gray-200 bg-white p-4">
        <div id="st-cust" class="text-[22px] font-semibold tabular-nums tracking-tight">0</div>
        <div class="mt-0.5 text-xs text-gray-500">Customer</div>
      </div>
      <div class="rounded-xl border border-gray-200 bg-white p-4">
        <div id="st-items" class="text-[22px] font-semibold tabular-nums tracking-tight">0</div>
        <div class="mt-0.5 text-xs text-gray-500">Baris produk</div>
      </div>
      <div class="rounded-xl border border-gray-200 bg-white p-4">
        <div id="st-total" class="text-[22px] font-semibold tabular-nums tracking-tight">Rp 0</div>
        <div id="st-total-label" class="mt-0.5 text-xs text-gray-500">Total</div>
      </div>
    </section>

    <div class="grid items-start gap-5 lg:grid-cols-[340px_1fr]">

      <!-- Kolom kiri -->
      <aside class="flex flex-col gap-4">

        <section class="rounded-xl border border-gray-200 bg-white p-4">
          <h3 class="mb-3 text-xs font-semibold uppercase tracking-wider text-gray-500">Data</h3>
          <label class="flex h-11 cursor-pointer items-center justify-center rounded-[10px] border border-dashed border-gray-300 bg-gray-50 text-[13px] font-medium text-gray-700 transition hover:border-accent-600 hover:bg-accent-50 hover:text-accent-600">
            <input type="file" id="file" accept=".csv,.xlsx,.xls" class="hidden">
            <span>Pilih file CSV atau XLSX</span>
          </label>
          <div id="fname" class="mt-2 text-xs text-gray-500">Belum ada file.</div>
        </section>

        <section class="rounded-xl border border-gray-200 bg-white p-4">
          <h3 class="mb-3 text-xs font-semibold uppercase tracking-wider text-gray-500">Filter</h3>
          <label for="q" class="mb-1.5 block text-xs font-medium text-gray-700">Cari</label>
          <input id="q" placeholder="Nama, produk, SKU, resi"
            class="h-9 w-full rounded-lg border border-gray-300 bg-white px-3 text-[13px] focus:border-accent-600 focus:outline-none focus:ring-[3px] focus:ring-accent-200">
          <div class="mt-3 grid grid-cols-2 gap-2.5">
            <div>
              <label for="status" class="mb-1.5 block text-xs font-medium text-gray-700">Status</label>
              <select id="status" class="h-9 w-full rounded-lg border border-gray-300 bg-white px-2 text-[13px] focus:border-accent-600 focus:outline-none focus:ring-[3px] focus:ring-accent-200"><option value="">Semua</option></select>
            </div>
            <div>
              <label for="metode" class="mb-1.5 block text-xs font-medium text-gray-700">Metode</label>
              <select id="metode" class="h-9 w-full rounded-lg border border-gray-300 bg-white px-2 text-[13px] focus:border-accent-600 focus:outline-none focus:ring-[3px] focus:ring-accent-200"><option value="">Semua</option></select>
            </div>
          </div>
          <div class="mt-3 grid grid-cols-2 gap-2.5">
            <div>
              <label for="from" class="mb-1.5 block text-xs font-medium text-gray-700">Dari tanggal</label>
              <input type="date" id="from" class="h-9 w-full rounded-lg border border-gray-300 bg-white px-2 text-[13px] focus:border-accent-600 focus:outline-none focus:ring-[3px] focus:ring-accent-200">
            </div>
            <div>
              <label for="to" class="mb-1.5 block text-xs font-medium text-gray-700">Sampai tanggal</label>
              <input type="date" id="to" class="h-9 w-full rounded-lg border border-gray-300 bg-white px-2 text-[13px] focus:border-accent-600 focus:outline-none focus:ring-[3px] focus:ring-accent-200">
            </div>
          </div>
        </section>

        <section class="rounded-xl border border-gray-200 bg-white p-4">
          <div class="mb-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500">Customer</h3>
              <span id="cust-count" class="rounded-full bg-gray-100 px-2 py-0.5 text-xs tabular-nums text-gray-700"></span>
            </div>
            <button id="btn-print-all" class="h-8 rounded-lg border border-gray-300 bg-white px-3 text-xs font-medium text-gray-900 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40">Cetak semua</button>
          </div>
          <div id="list" class="max-h-[520px] overflow-auto pr-0.5">
            <p class="muted rounded-lg border border-dashed border-gray-200 px-3 py-7 text-center">Upload file untuk mulai.</p>
          </div>
        </section>
      </aside>

      <!-- Kolom kanan -->
      <div class="flex min-w-0 flex-col gap-5">
        <section class="rounded-xl border border-gray-200 bg-white p-4">
          <div class="mb-3 flex items-center justify-between gap-2">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500">Rekap produk</h3>
            <button id="btn-print-rekap" class="h-8 rounded-lg border border-gray-300 bg-white px-3 text-xs font-medium text-gray-900 hover:bg-gray-50 disabled:opacity-40">Cetak rekap</button>
          </div>
          <div id="rekap" class="max-h-[460px] overflow-auto rounded-lg border border-gray-200">
            <p class="muted px-3 py-7 text-center">Upload file untuk melihat rekap.</p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Modal preview invoice -->
  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="pv-title" class="fixed inset-0 z-50 flex items-center justify-center p-6">
    <div data-close class="absolute inset-0 bg-gray-900/45"></div>
    <div class="relative flex max-h-[calc(100vh-48px)] w-full max-w-[900px] flex-col rounded-2xl bg-white shadow-2xl">
      <div class="flex items-center justify-between gap-3 border-b border-gray-200 px-5 py-4">
        <h2 id="pv-title" class="text-base font-semibold"></h2>
        <div class="flex items-center gap-2">
          <button id="btn-print-one" class="h-9 rounded-lg bg-gray-900 px-3.5 text-[13px] font-medium text-white hover:bg-gray-800">Cetak invoice</button>
          <button data-close aria-label="Tutup" class="grid h-9 w-9 place-items-center rounded-lg border border-gray-300 bg-white text-xl leading-none text-gray-900 hover:bg-gray-50">&times;</button>
        </div>
      </div>
      <div class="overflow-auto p-5">
        <div id="warn"></div>
        <div id="pv" class="rounded-xl bg-gray-100 px-4 py-7"></div>
      </div>
    </div>
  </div>

  <div id="print-area"></div>

  <script src="/vendor/xlsx.full.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
